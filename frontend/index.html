<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>YT Downloader</h1>
    <p id="backendStatus"></p>

    <div class="barra-url">
        <input type="text" id="videoUrl" placeholder="URL do vídeo">
        <button id="buscarInfo" onclick="buscarInfo()">Enviar</button>
    </div>

    <div id="infoBox">Info</div>

    <div id="formatosBox">
        <h3>Formatos</h3>
        <div id="infoVideo">Video</div>
        <div id="infoAudio">Audio</div>
        <button id="downloadFormato" onclick="downloadFormato()">Download</button>
        <span id="avisoDownloadFormato" class="aviso-vermelho"></span>
    </div>
    <br><br>
    <div id="conversorBox">
        <h3>Conversor</h3>

        <div id="legendasBox">
            <h4>Legendas <small class="aviso-rate-limit">(pode haver problemas com rate limiter do YouTube)</small></h4>
            <p id="legendasAviso" style="color: gray;">Disponível apenas ao converter para MKV.</p>
            <div id="legendasOpcoes" style="display: none;"></div>
        </div>

        <div id="conversorVideo"></div>
        <div id="conversorAudio"></div>

        <button id="downloadConversor" onclick="downloadConversor()">Converter e fazer Download</button>
        <span id="avisoDownloadConversor" class="aviso-vermelho"></span>
    </div>

    <div id="downloadLinkBox"></div>

    <script src="script.js"></script>
</body>

</html>
